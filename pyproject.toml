[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jollyrating"
version = "0.1.0"
description = "Season-based rating system for a vjudge group (JollyBee rating rules)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.scripts]
jollyrating = "jollyrating.cli:main"

[tool.setuptools.packages.find]
include = ["jollyrating*"]
